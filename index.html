<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>edh-tracker</title>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const key = urlParams.get('key');
      
      const manifest = {
        "short_name": "EDH Tracker",
        "name": "EDH Tracker",
        "icons": [
          { "src": "/public/icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
          { "src": "/public/icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any" }
        ],
        // If there is a key in the URL, the "App" will always start with it
        "start_url": key ? `./?key=${key}` : ".",
        "display": "standalone",
        "theme_color": "#000000",
        "background_color": "#000000"
      };

      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], {type: 'application/json'});
      const manifestURL = URL.createObjectURL(blob);
      
      const linkTag = document.createElement('link');
      linkTag.rel = 'manifest';
      linkTag.href = manifestURL;
      document.head.appendChild(linkTag);
    })();
  </script>

  <link rel="apple-touch-icon" href="/public/icon.png">
  <link rel="icon" sizes="192x192" href="/public/icon.png">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDH Tracker"> 
</head>

  
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
  </body>
</html>
